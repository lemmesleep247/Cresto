name: Build & Release APK

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Read version.properties
      #
      # Expected:
      # VERSION_NAME=1.0
      # VERSION_CODE=1082
      #
      # Result:
      # VERSION=1.0.1082
      # TAG=v1.0.1082
      # ------------------------------------------------------------
      - name: Determine release version
        id: version
        shell: bash
        run: |
          if [ ! -f version.properties ]; then
            echo "ERROR: version.properties not found!"
            exit 1
          fi

          VERSION_NAME=$(grep '^VERSION_NAME=' version.properties \
            | head -n 1 \
            | cut -d'=' -f2- \
            | tr -d '\r' \
            | xargs)

          VERSION_CODE=$(grep '^VERSION_CODE=' version.properties \
            | head -n 1 \
            | cut -d'=' -f2- \
            | tr -d '\r' \
            | xargs)

          if [ -z "$VERSION_NAME" ]; then
            echo "ERROR: VERSION_NAME is missing from version.properties"
            exit 1
          fi

          if [ -z "$VERSION_CODE" ]; then
            echo "ERROR: VERSION_CODE is missing from version.properties"
            exit 1
          fi

          # VERSION_CODE must be numeric
          if [[ ! "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "ERROR: VERSION_CODE must be numeric"
            echo "Found: $VERSION_CODE"
            exit 1
          fi

          VERSION="${VERSION_NAME}.${VERSION_CODE}"
          TAG="v${VERSION}"

          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"

          echo "----------------------------------------"
          echo "VERSION_NAME : ${VERSION_NAME}"
          echo "VERSION_CODE : ${VERSION_CODE}"
          echo "VERSION      : ${VERSION}"
          echo "TAG          : ${TAG}"
          echo "----------------------------------------"

      # ------------------------------------------------------------
      # 3. For manual workflow runs:
      #    create the release tag from version.properties
      # ------------------------------------------------------------
      - name: Create release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.TAG }}
        shell: bash
        run: |
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}$"; then
            echo "Tag ${TAG} already exists."

            git fetch origin \
              "refs/tags/${TAG}:refs/tags/${TAG}"

          else
            echo "Creating tag ${TAG}..."

            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
          fi

      # ------------------------------------------------------------
      # 4. Checkout exact release tag for manual releases
      # ------------------------------------------------------------
      - name: Checkout release tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.TAG }}
          fetch-depth: 0

      # ------------------------------------------------------------
      # 5. For tag-triggered releases, verify the tag matches
      #    version.properties
      # ------------------------------------------------------------
      - name: Verify release tag
        if: github.event_name == 'push'
        env:
          EXPECTED_TAG: ${{ steps.version.outputs.TAG }}
        shell: bash
        run: |
          ACTUAL_TAG="${GITHUB_REF#refs/tags/}"

          echo "Expected tag: ${EXPECTED_TAG}"
          echo "Actual tag:   ${ACTUAL_TAG}"

          if [ "$ACTUAL_TAG" != "$EXPECTED_TAG" ]; then
            echo ""
            echo "ERROR: Tag does not match version.properties!"
            echo ""
            echo "version.properties expects:"
            echo "  ${EXPECTED_TAG}"
            echo ""
            echo "But the workflow was triggered by:"
            echo "  ${ACTUAL_TAG}"
            echo ""
            echo "Update version.properties or create the correct tag."
            exit 1
          fi

          echo "Tag matches version.properties."

      # ------------------------------------------------------------
      # 6. Setup Java 17
      # ------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ------------------------------------------------------------
      # 7. Setup Android SDK
      # ------------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: |
          sdkmanager \
            "platforms;android-37" \
            "build-tools;37.0.0"

          yes | sdkmanager --licenses > /dev/null || true

      # ------------------------------------------------------------
      # 8. Prepare Gradle
      # ------------------------------------------------------------
      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # ------------------------------------------------------------
      # 9. Build release APK
      # ------------------------------------------------------------
      - name: Build release APK
        run: |
          ./gradlew clean assembleRelease \
            --no-daemon \
            --stacktrace

      # ------------------------------------------------------------
      # 10. Decode release keystore
      # ------------------------------------------------------------
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: RELEASE_KEYSTORE_BASE64 secret is empty."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

          if [ ! -s release.keystore ]; then
            echo "ERROR: release.keystore was not created."
            exit 1
          fi

          echo "Release keystore decoded successfully."

      # ------------------------------------------------------------
      # 11. Locate release APK
      # ------------------------------------------------------------
      - name: Locate release APK
        id: apk
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            ! -name "*aligned*" \
            ! -name "*signed*" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK found!"

            echo ""
            echo "Available build outputs:"
            find app/build/outputs -type f || true

            exit 1
          fi

          echo "Found APK: $APK"
          echo "input=$APK" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 12. Zipalign APK
      # ------------------------------------------------------------
      - name: Zipalign APK
        run: |
          APK="${{ steps.apk.outputs.input }}"
          ALIGNED="app/build/outputs/apk/release/cresto-release-aligned.apk"

          "$ANDROID_HOME/build-tools/37.0.0/zipalign" \
            -v -p 4 \
            "$APK" \
            "$ALIGNED"

      # ------------------------------------------------------------
      # 13. Sign APK
      # ------------------------------------------------------------
      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ALIGNED="app/build/outputs/apk/release/cresto-release-aligned.apk"
          SIGNED="app/build/outputs/apk/release/cresto-release.apk"

          "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED" \
            "$ALIGNED"

      # ------------------------------------------------------------
      # 14. Verify APK signature
      # ------------------------------------------------------------
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify \
            --verbose \
            app/build/outputs/apk/release/cresto-release.apk

      # ------------------------------------------------------------
      # 15. Rename APK
      #
      # Example:
      # VERSION_NAME=1.0
      # VERSION_CODE=1082
      #
      # Result:
      # Cresto-1.0.1082.apk
      # ------------------------------------------------------------
      - name: Rename APK
        run: |
          VERSION_NAME="${{ steps.version.outputs.VERSION_NAME }}"
          VERSION_CODE="${{ steps.version.outputs.VERSION_CODE }}"
          VERSION="${VERSION_NAME}.${VERSION_CODE}"

          mv \
            app/build/outputs/apk/release/cresto-release.apk \
            "app/build/outputs/apk/release/Cresto-${VERSION}.apk"

          echo "Release APK:"
          echo "Cresto-${VERSION}.apk"

      # ------------------------------------------------------------
      # 16. Create GitHub Release
      #
      # Example:
      # Tag:   v1.0.1082
      # Title: Cresto 1.0.1082
      # APK:   Cresto-1.0.1082.apk
      # ------------------------------------------------------------
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME="${{ steps.version.outputs.VERSION_NAME }}"
          VERSION_CODE="${{ steps.version.outputs.VERSION_CODE }}"
          VERSION="${VERSION_NAME}.${VERSION_CODE}"
          TAG="${{ steps.version.outputs.TAG }}"

          gh release create "$TAG" \
            "app/build/outputs/apk/release/Cresto-${VERSION}.apk" \
            --title "Cresto ${VERSION}" \
            --generate-notes

      # ------------------------------------------------------------
      # 17. Cleanup signing material
      # ------------------------------------------------------------
      - name: Cleanup keystore
        if: always()
        run: |
          rm -f release.keystore
