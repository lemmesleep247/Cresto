name: Build & Release APK

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Read app/version.properties
      # ------------------------------------------------------------
      - name: Determine release version
        id: version
        shell: bash
        run: |
          VERSION_FILE="app/version.properties"

          if [ ! -f "$VERSION_FILE" ]; then
            echo "ERROR: $VERSION_FILE not found!"
            echo ""
            echo "Searching repository:"
            find . -name "version.properties" -print
            exit 1
          fi

          VERSION_NAME=$(grep '^VERSION_NAME=' "$VERSION_FILE" \
            | head -n 1 \
            | cut -d'=' -f2- \
            | tr -d '\r' \
            | xargs)

          VERSION_CODE=$(grep '^VERSION_CODE=' "$VERSION_FILE" \
            | head -n 1 \
            | cut -d'=' -f2- \
            | tr -d '\r' \
            | xargs)

          if [ -z "$VERSION_NAME" ]; then
            echo "ERROR: VERSION_NAME is missing."
            exit 1
          fi

          if [ -z "$VERSION_CODE" ]; then
            echo "ERROR: VERSION_CODE is missing."
            exit 1
          fi

          if [[ ! "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "ERROR: VERSION_CODE must be numeric."
            exit 1
          fi

          VERSION="${VERSION_NAME}.${VERSION_CODE}"
          TAG="v${VERSION}"

          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"

          echo "Version name : ${VERSION_NAME}"
          echo "Version code : ${VERSION_CODE}"
          echo "Version      : ${VERSION}"
          echo "Tag          : ${TAG}"

      # ------------------------------------------------------------
      # 3. Verify tag for tag-triggered builds
      # ------------------------------------------------------------
      - name: Verify release tag
        if: github.event_name == 'push'
        env:
          EXPECTED_TAG: ${{ steps.version.outputs.TAG }}
        run: |
          ACTUAL_TAG="${GITHUB_REF#refs/tags/}"

          echo "Expected: ${EXPECTED_TAG}"
          echo "Actual:   ${ACTUAL_TAG}"

          if [ "$ACTUAL_TAG" != "$EXPECTED_TAG" ]; then
            echo ""
            echo "ERROR: Git tag does not match app/version.properties."
            echo ""
            echo "version.properties expects:"
            echo "  ${EXPECTED_TAG}"
            echo ""
            echo "But workflow was triggered by:"
            echo "  ${ACTUAL_TAG}"
            exit 1
          fi

      # ------------------------------------------------------------
      # 4. Create tag for manual workflow runs
      # ------------------------------------------------------------
      - name: Create release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.TAG }}
        run: |
          if git ls-remote --tags origin "refs/tags/${TAG}" \
            | grep -q "refs/tags/${TAG}$"; then

            echo "Tag ${TAG} already exists."

            git fetch origin \
              "refs/tags/${TAG}:refs/tags/${TAG}"

          else
            echo "Creating tag ${TAG}..."

            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
          fi

      # ------------------------------------------------------------
      # 5. Checkout exact release tag
      # ------------------------------------------------------------
      - name: Checkout release tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.TAG }}
          fetch-depth: 0

      # ------------------------------------------------------------
      # 6. Setup JDK 17
      # ------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ------------------------------------------------------------
      # 7. Setup Android SDK
      # ------------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ------------------------------------------------------------
      # 8. Update Android SDK tools and install API 37
      # ------------------------------------------------------------
      - name: Install Android SDK 37
        shell: bash
        run: |
          echo "Android SDK: $ANDROID_HOME"
          echo "Updating SDK package metadata..."
          sdkmanager --update
          echo "Accepting Android SDK licenses..."
          yes | sdkmanager --licenses > /dev/null || true
          echo "Available Android platforms:"
          sdkmanager --list | grep -E "platforms;android-[0-9]+(\.[0-9]+)?" | head -20 || true
          echo "Installing Android SDK Platform 37.1..."
          sdkmanager "platforms;android-37.1"
          echo "Installing platform tools..."
          sdkmanager "platform-tools"
          echo ""
          echo "Installed Android platforms:"
          sdkmanager --list_installed | grep "platforms;android" || true
      # ------------------------------------------------------------
      # 9. Find a compatible Build Tools version
      # ------------------------------------------------------------
      - name: Determine Build Tools version
        id: build-tools
        shell: bash
        run: |
          echo "Installed Build Tools:"

          ls -1 "$ANDROID_HOME/build-tools" || true

          BUILD_TOOLS_VERSION=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -printf '%f\n' \
            | sort -V \
            | tail -n 1)

          if [ -z "$BUILD_TOOLS_VERSION" ]; then
            echo "ERROR: No Android Build Tools found."
            exit 1
          fi

          echo "Using Build Tools: $BUILD_TOOLS_VERSION"

          echo "VERSION=$BUILD_TOOLS_VERSION" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 10. Prepare Gradle
      # ------------------------------------------------------------
      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # ------------------------------------------------------------
      # 11. Build release APK
      # ------------------------------------------------------------
      - name: Build release APK
        run: |
          ./gradlew clean assembleRelease \
            --no-daemon \
            --stacktrace

      # ------------------------------------------------------------
      # 12. Decode release keystore
      # ------------------------------------------------------------
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: RELEASE_KEYSTORE_BASE64 is empty."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

          if [ ! -s release.keystore ]; then
            echo "ERROR: Failed to create release.keystore."
            exit 1
          fi

      # ------------------------------------------------------------
      # 13. Locate APK
      # ------------------------------------------------------------
      - name: Locate release APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            ! -name "*aligned*" \
            ! -name "*signed*" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK found."

            find app/build/outputs -type f || true
            exit 1
          fi

          echo "Found: $APK"
          echo "input=$APK" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 14. Zipalign APK
      # ------------------------------------------------------------
      - name: Zipalign APK
        env:
          BUILD_TOOLS_VERSION: ${{ steps.build-tools.outputs.VERSION }}
        run: |
          APK="${{ steps.apk.outputs.input }}"
          ALIGNED="app/build/outputs/apk/release/cresto-release-aligned.apk"

          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/zipalign"

          if [ ! -f "$ZIPALIGN" ]; then
            echo "ERROR: zipalign not found:"
            echo "$ZIPALIGN"
            exit 1
          fi

          "$ZIPALIGN" \
            -v -p 4 \
            "$APK" \
            "$ALIGNED"

      # ------------------------------------------------------------
      # 15. Sign APK
      # ------------------------------------------------------------
      - name: Sign APK
        env:
          BUILD_TOOLS_VERSION: ${{ steps.build-tools.outputs.VERSION }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ALIGNED="app/build/outputs/apk/release/cresto-release-aligned.apk"
          SIGNED="app/build/outputs/apk/release/cresto-release.apk"

          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"

          if [ ! -f "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found:"
            echo "$APKSIGNER"
            exit 1
          fi

          "$APKSIGNER" sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED" \
            "$ALIGNED"

      # ------------------------------------------------------------
      # 16. Verify APK signature
      # ------------------------------------------------------------
      - name: Verify APK signature
        env:
          BUILD_TOOLS_VERSION: ${{ steps.build-tools.outputs.VERSION }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            app/build/outputs/apk/release/cresto-release.apk

      # ------------------------------------------------------------
      # 17. Rename APK
      # ------------------------------------------------------------
      - name: Rename APK
        run: |
          VERSION_NAME="${{ steps.version.outputs.VERSION_NAME }}"
          VERSION_CODE="${{ steps.version.outputs.VERSION_CODE }}"
          VERSION="${VERSION_NAME}.${VERSION_CODE}"

          mv \
            app/build/outputs/apk/release/cresto-release.apk \
            "app/build/outputs/apk/release/Cresto-${VERSION}.apk"

      # ------------------------------------------------------------
      # 18. Create GitHub Release
      # ------------------------------------------------------------
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TAG="${{ steps.version.outputs.TAG }}"

          gh release create "$TAG" \
            "app/build/outputs/apk/release/Cresto-${VERSION}.apk" \
            --title "Cresto ${VERSION}" \
            --generate-notes

      # ------------------------------------------------------------
      # 19. Cleanup keystore
      # ------------------------------------------------------------
      - name: Cleanup keystore
        if: always()
        run: |
          rm -f release.keystore
